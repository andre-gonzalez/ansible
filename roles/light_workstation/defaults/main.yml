---
# TLP power management defaults.
# Consumed by templates/tlp-local.conf.j2 (see tasks/save-battery.yml).
# Override per host/group in group_vars/ — e.g. group_vars/samsung_expert.

# Battery charge thresholds (ThinkPad only, applied via natacpi).
# Charging stops at STOP and only resumes below START. The gap is hysteresis:
# without it the battery would micro-cycle around the stop threshold.
light_workstation_tlp_start_charge_thresh: 77
light_workstation_tlp_stop_charge_thresh: 80

# amdgpu Adaptive Backlight Management on battery. 0 = off, 3 = most
# aggressive. Set to 0 on machines used for colour-sensitive work.
light_workstation_tlp_abm_level_on_bat: 2

# USB devices exempted from autosuspend, as "vendor:product" ids.
# Populate if a wireless receiver or dock peripheral becomes laggy.
light_workstation_tlp_usb_denylist: []

# SATA/spinning disks managed by TLP, as /dev/disk/by-id names.
# Empty on NVMe-only hosts — NVMe power states are handled by the kernel's
# APST and are not configurable through TLP.
light_workstation_tlp_sata_disk_ids: []
light_workstation_tlp_disk_spindown_on_ac: "0 0"
light_workstation_tlp_disk_spindown_on_bat: "0 12"

# Snapper configs to manage. Each must already exist under /etc/snapper/configs
# — tasks/snapper.yml creates them.
light_workstation_snapper_configs:
  - root
  - home

# Snapshot retention shared by every config listed above. Per-config deviations
# go in light_workstation_snapper_retention_overrides below. Override per
# host/group in group_vars/ when a machine has room to keep more history.
#
# The timeline limits are the ones that actually bound disk usage. Snapper keeps
# the newest N snapshots in each bucket independently, so the totals add up:
# these values cap a config at 8 timeline snapshots (5 hourly + 3 daily).
# The long-horizon buckets are deliberately 0 — a year-old snapshot pins every block
# that has changed since it was taken, which on a workstation is most of the
# filesystem, and that space can never be reclaimed while it exists.
light_workstation_snapper_retention:
  TIMELINE_LIMIT_HOURLY: 5
  TIMELINE_LIMIT_DAILY: 3
  TIMELINE_LIMIT_WEEKLY: 0
  TIMELINE_LIMIT_MONTHLY: 0
  TIMELINE_LIMIT_QUARTERLY: 0
  TIMELINE_LIMIT_YEARLY: 0
  # Pre/post pairs created by snap-pac around each pacman transaction.
  NUMBER_LIMIT: 10
  NUMBER_LIMIT_IMPORTANT: 5
  # Fractions of the filesystem. Snapper only honours these once a btrfs qgroup
  # exists for the config, which is what the setup-quota task below arranges;
  # without it both values are silently ignored.
  SPACE_LIMIT: "0.2"
  FREE_LIMIT: "0.2"

# Keys merged over light_workstation_snapper_retention for one config, keyed by
# config name. A config without an entry uses the shared values unchanged.
#
# root drops hourly snapshots (3 timeline snapshots in total): the snap-pac
# pre/post pairs already give a rollback point around every package change,
# and hourly snapshots of / add little on top of them. Holding fewer pairs
# also releases the old package files they pin sooner.
light_workstation_snapper_retention_overrides:
  root:
    TIMELINE_LIMIT_HOURLY: 0
    NUMBER_LIMIT: 6

# Directories under the user's home kept out of the home snapshots. Snapper
# snapshots a single subvolume and never descends into nested ones, so making
# these nested btrfs subvolumes means cache churn and game updates are freed
# as soon as they are deleted instead of being pinned by every snapshot for
# days. tasks/snapper.yml turns this list into a systemd-tmpfiles drop-in.
# Paths are relative to the home directory.
light_workstation_nosnapshot_dirs:
  - path: .cache
    mode: "0700"
  - path: .local/share/Steam
    mode: "0755"

# GPG secret keys restored by tasks/gpg.yml, by fingerprint (public). The
# armored export lives vaulted in files/gpg-secret-keys.asc, written by the
# NixOS repo's secrets/export-gpg-keys.sh. Keep in sync with its
# modules/home/gpg-keys.nix.
light_workstation_gpg_keys:
  - 546B690A34BFB5F67D768159BB1AC653FDBAD33C # André Gonzalez (personal) <lopescg@gmail.com>
  # Not the Athenaworks key (A2F88C89…BE5ED78E): its passphrase is lost.

# OpenSnitch (tasks/opensnitch.yml). DefaultAction applies to a connection no
# rule matches when opensnitch-ui does not answer: before startx, in a TTY or
# over SSH. "allow" while it learns; "deny" once the rules cover daily use.
light_workstation_opensnitch_default_action: allow

# Rules for what must reach the network without a prompt. Each becomes
# /etc/opensnitchd/rules/<name>.json (action allow, duration always); rules
# made in opensnitch-ui live next to them.
light_workstation_opensnitch_rules:
  - name: 000-allow-localhost-ipv4
    description: Loopback (systemd-resolved stub, local services)
    type: network
    operand: dest.network
    data: 127.0.0.0/8
  - name: 000-allow-localhost-ipv6
    description: Loopback (systemd-resolved stub, local services)
    type: network
    operand: dest.network
    data: "::1/128"
  - name: 001-allow-systemd-resolved
    description: DNS for every program
    type: simple
    operand: process.path
    data: /usr/lib/systemd/systemd-resolved
  - name: 001-allow-systemd-timesyncd
    description: NTP
    type: simple
    operand: process.path
    data: /usr/lib/systemd/systemd-timesyncd
  - name: 001-allow-iwd
    description: WiFi and its DHCP
    type: simple
    operand: process.path
    data: /usr/lib/iwd/iwd
  - name: 001-allow-tailscaled
    description: Tailscale control plane and DERP relays
    type: simple
    operand: process.path
    data: /usr/bin/tailscaled
  - name: 001-allow-pacman
    description: Package downloads, also for yay and Ansible
    type: simple
    operand: process.path
    data: /usr/bin/pacman
  - name: 001-allow-dockerd
    description: Image pulls
    type: simple
    operand: process.path
    data: /usr/bin/dockerd
  - name: 001-allow-kdeconnectd
    description: Phone over Tailscale (dwmblocks battery block)
    type: simple
    operand: process.path
    data: /usr/bin/kdeconnectd
