---
# TLP power management defaults.
# Consumed by templates/tlp-local.conf.j2 (see tasks/save-battery.yml).
# Override per host/group in group_vars/ — e.g. group_vars/samsung_expert.

# Battery charge thresholds (ThinkPad only, applied via natacpi).
# Charging stops at STOP and only resumes below START. The gap is hysteresis:
# without it the battery would micro-cycle around the stop threshold.
light_workstation_tlp_start_charge_thresh: 77
light_workstation_tlp_stop_charge_thresh: 80

# amdgpu Adaptive Backlight Management on battery. 0 = off, 3 = most
# aggressive. Set to 0 on machines used for colour-sensitive work.
light_workstation_tlp_abm_level_on_bat: 2

# USB devices exempted from autosuspend, as "vendor:product" ids.
# Populate if a wireless receiver or dock peripheral becomes laggy.
light_workstation_tlp_usb_denylist: []

# SATA/spinning disks managed by TLP, as /dev/disk/by-id names.
# Empty on NVMe-only hosts — NVMe power states are handled by the kernel's
# APST and are not configurable through TLP.
light_workstation_tlp_sata_disk_ids: []
light_workstation_tlp_disk_spindown_on_ac: "0 0"
light_workstation_tlp_disk_spindown_on_bat: "0 12"

# Snapper configs to manage. Each must already exist under /etc/snapper/configs
# — tasks/snapper.yml creates them.
light_workstation_snapper_configs:
  - root
  - home

# Snapshot retention shared by every config listed above. Per-config deviations
# go in light_workstation_snapper_retention_overrides below. Override per
# host/group in group_vars/ when a machine has room to keep more history.
#
# The timeline limits are the ones that actually bound disk usage. Snapper keeps
# the newest N snapshots in each bucket independently, so the totals add up:
# these values cap a config at 8 timeline snapshots (5 hourly + 3 daily).
# The long-horizon buckets are deliberately 0 — a year-old snapshot pins every block
# that has changed since it was taken, which on a workstation is most of the
# filesystem, and that space can never be reclaimed while it exists.
light_workstation_snapper_retention:
  TIMELINE_LIMIT_HOURLY: 5
  TIMELINE_LIMIT_DAILY: 3
  TIMELINE_LIMIT_WEEKLY: 0
  TIMELINE_LIMIT_MONTHLY: 0
  TIMELINE_LIMIT_QUARTERLY: 0
  TIMELINE_LIMIT_YEARLY: 0
  # Pre/post pairs created by snap-pac around each pacman transaction.
  NUMBER_LIMIT: 10
  NUMBER_LIMIT_IMPORTANT: 5
  # Fractions of the filesystem. Snapper only honours these once a btrfs qgroup
  # exists for the config, which is what the setup-quota task below arranges;
  # without it both values are silently ignored.
  SPACE_LIMIT: "0.2"
  FREE_LIMIT: "0.2"

# Keys merged over light_workstation_snapper_retention for one config, keyed by
# config name. A config without an entry uses the shared values unchanged.
#
# root drops hourly snapshots (3 timeline snapshots in total): the snap-pac
# pre/post pairs already give a rollback point around every package change,
# and hourly snapshots of / add little on top of them. Holding fewer pairs
# also releases the old package files they pin sooner.
light_workstation_snapper_retention_overrides:
  root:
    TIMELINE_LIMIT_HOURLY: 0
    NUMBER_LIMIT: 6

# Directories under the user's home kept out of the home snapshots. Snapper
# snapshots a single subvolume and never descends into nested ones, so making
# these nested btrfs subvolumes means cache churn and game updates are freed
# as soon as they are deleted instead of being pinned by every snapshot for
# days. tasks/snapper.yml turns this list into a systemd-tmpfiles drop-in.
# Paths are relative to the home directory.
light_workstation_nosnapshot_dirs:
  - path: .cache
    mode: "0700"
  - path: .local/share/Steam
    mode: "0755"

# GPG secret keys restored by tasks/gpg.yml, by fingerprint (public). The
# armored export lives vaulted in files/gpg-secret-keys.asc, written by the
# NixOS repo's secrets/export-gpg-keys.sh. Keep in sync with its
# modules/home/gpg-keys.nix.
light_workstation_gpg_keys:
  - 546B690A34BFB5F67D768159BB1AC653FDBAD33C # André Gonzalez (personal) <lopescg@gmail.com>
  # Not the Athenaworks key (A2F88C89…BE5ED78E): its passphrase is lost.

# OpenSnitch (tasks/opensnitch.yml). DefaultAction applies to a connection no
# rule matches when opensnitch-ui does not answer: before startx, in a TTY or
# over SSH.
light_workstation_opensnitch_default_action: deny

# Rules for what may reach the network without a prompt. Each becomes
# /etc/opensnitchd/rules/<name>.json (action allow, duration always); rules
# made in opensnitch-ui live next to them until they are moved here.
# type list: every entry of `list` must match (opensnitch-ui writes the same).
light_workstation_opensnitch_rules:
  # System daemons
  - name: 000-allow-localhost-ipv4
    description: Loopback (systemd-resolved stub, local services)
    type: network
    operand: dest.network
    data: 127.0.0.0/8
  - name: 000-allow-localhost-ipv6
    description: Loopback (systemd-resolved stub, local services)
    type: network
    operand: dest.network
    data: "::1/128"
  - name: 001-allow-systemd-resolved
    description: DNS for every program
    type: simple
    operand: process.path
    data: /usr/lib/systemd/systemd-resolved
  - name: 001-allow-systemd-timesyncd
    description: NTP
    type: simple
    operand: process.path
    data: /usr/lib/systemd/systemd-timesyncd
  - name: 001-allow-systemd-networkd
    description: Wired DHCP
    type: simple
    operand: process.path
    data: /usr/lib/systemd/systemd-networkd
  - name: 001-allow-iwd
    description: WiFi and its DHCP
    type: simple
    operand: process.path
    data: /usr/lib/iwd/iwd
  - name: 001-allow-tailscaled
    description: Tailscale control plane and DERP relays
    type: simple
    operand: process.path
    data: /usr/bin/tailscaled
  - name: 001-allow-pacman
    description: Package downloads, also for yay and Ansible
    type: simple
    operand: process.path
    data: /usr/bin/pacman
  - name: 001-allow-dockerd
    description: Image pulls
    type: simple
    operand: process.path
    data: /usr/bin/dockerd
  - name: 001-allow-docker-proxy
    description: Published container ports
    type: simple
    operand: process.path
    data: /usr/bin/docker-proxy
  - name: 001-allow-freshclam
    description: ClamAV signature updates
    type: simple
    operand: process.path
    data: /usr/bin/freshclam
  - name: 001-allow-arch-audit
    description: Arch security tracker, from the pacman hook
    type: simple
    operand: process.path
    data: /usr/bin/arch-audit
  - name: 001-allow-kdeconnectd
    description: Phone over Tailscale (dwmblocks battery block)
    type: simple
    operand: process.path
    data: /usr/bin/kdeconnectd
  # Only to the mDNS multicast groups, not port 5353 anywhere
  - name: 001-allow-mdns
    description: mDNS queries (avahi, systemd-resolved)
    type: list
    list:
      - { type: simple, operand: dest.port, data: "5353" }
      - { type: regexp, operand: dest.ip, data: '^(224\.0\.0\.251|ff02::fb)$' }

  # Applications
  - name: 100-allow-1password
    description: 1Password sync
    type: simple
    operand: process.path
    data: /opt/1Password/1password
  - name: 100-allow-claude
    description: Claude Code
    type: simple
    operand: process.path
    data: /opt/claude-code/bin/claude
  - name: 100-allow-helium
    description: Helium browser
    type: simple
    operand: process.path
    data: /opt/helium-browser-bin/helium
  - name: 100-allow-chromium
    description: Chromium
    type: simple
    operand: process.path
    data: /usr/lib/chromium/chromium
  - name: 100-allow-lynx
    description: Lynx text browser
    type: simple
    operand: process.path
    data: /usr/bin/lynx
  - name: 100-allow-webkit-network
    description: Network process of every WebKitGTK program
    type: simple
    operand: process.path
    data: /usr/lib/webkit2gtk-4.1/WebKitNetworkProcess
  - name: 100-allow-slack
    description: Slack
    type: simple
    operand: process.path
    data: /usr/lib/slack/slack
  - name: 100-allow-insync
    description: Insync (Google Drive)
    type: simple
    operand: process.path
    data: /usr/lib/insync/insync
  - name: 100-allow-insync-webengine
    description: Insync sign-in window
    type: simple
    operand: process.path
    data: /usr/lib/insync/PySide2/Qt/libexec/QtWebEngineProcess
  - name: 100-allow-enteauth
    description: Ente Auth sync
    type: simple
    operand: process.path
    data: /usr/share/enteauth/enteauth
  - name: 100-allow-whispering
    description: Whispering (transcription API)
    type: simple
    operand: process.path
    data: /usr/bin/whispering
  - name: 100-allow-spotify-launcher
    description: Spotify download and updates
    type: simple
    operand: process.path
    data: /usr/bin/spotify-launcher
  - name: 100-allow-newsboat
    description: RSS feeds
    type: simple
    operand: process.path
    data: /usr/bin/newsboat
  - name: 100-allow-mbsync
    description: Mail sync
    type: simple
    operand: process.path
    data: /usr/bin/mbsync
  - name: 100-allow-ssh
    description: SSH client
    type: simple
    operand: process.path
    data: /usr/bin/ssh
  - name: 100-allow-git-remote-http
    description: Git over HTTPS
    type: simple
    operand: process.path
    data: /usr/lib/git-core/git-remote-http
  - name: 100-allow-gh
    description: GitHub CLI
    type: simple
    operand: process.path
    data: /usr/bin/gh
  - name: 100-allow-glab
    description: GitLab CLI
    type: simple
    operand: process.path
    data: /usr/bin/glab
  - name: 100-allow-docker
    description: Docker CLI (registry login)
    type: simple
    operand: process.path
    data: /usr/bin/docker
  - name: 100-allow-terraform
    description: Terraform (provider downloads, state)
    type: simple
    operand: process.path
    data: /usr/bin/terraform
  - name: 100-allow-cmk-agent-ctl
    description: Checkmk agent registration
    type: simple
    operand: process.path
    data: /usr/bin/cmk-agent-ctl
  - name: 100-allow-nix
    description: Nix (flake inputs, substituters)
    type: simple
    operand: process.path
    data: /usr/bin/nix
  - name: 100-allow-yay
    description: AUR downloads
    type: simple
    operand: process.path
    data: /usr/bin/yay

  # Destinations any program may reach (mostly qutebrowser, whose
  # QtWebEngineProcess has no rule of its own)
  - name: 200-allow-bitwarden-com
    description: Bitwarden
    type: regexp
    operand: dest.host
    data: '^(|.*\.)bitwarden\.com$'
  - name: 200-allow-youtube-com
    description: YouTube
    type: regexp
    operand: dest.host
    data: '^(|.*\.)youtube\.com$'
  - name: 200-allow-googlevideo-com
    description: YouTube video streams
    type: regexp
    operand: dest.host
    data: '^(|.*\.)googlevideo\.com$'
  - name: 200-allow-sponsor-ajay-app
    description: SponsorBlock
    type: simple
    operand: dest.host
    data: sponsor.ajay.app
  - name: 200-allow-whatsapp-com
    description: WhatsApp Web
    type: regexp
    operand: dest.host
    data: '^(|.*\.)whatsapp\.com$'
  - name: 200-allow-whatsapp-net
    description: WhatsApp Web media
    type: regexp
    operand: dest.host
    data: '^(|.*\.)whatsapp\.net$'
  - name: 200-allow-hetzner-com
    description: Hetzner (servarr-failover)
    type: regexp
    operand: dest.host
    data: '^(|.*\.)hetzner\.com$'
  - name: 200-allow-hetzner-cloud
    description: Hetzner Cloud API (servarr-failover)
    type: regexp
    operand: dest.host
    data: '^(|.*\.)hetzner\.cloud$'
  - name: 200-allow-terraform-io
    description: Terraform registry
    type: regexp
    operand: dest.host
    data: '^(|.*\.)terraform\.io$'

  # Interpreters only to their package registry. curl and python have no
  # fixed destination: answer their prompts once or until reboot.
  - name: 300-allow-node-npm
    description: npm registry
    type: list
    list:
      - { type: simple, operand: process.path, data: /usr/bin/node }
      - { type: regexp, operand: dest.host, data: '^registry\.npmjs\.org$' }
  - name: 300-allow-cargo-crates-io
    description: crates.io index and downloads
    type: list
    list:
      - { type: simple, operand: process.path, data: /usr/bin/cargo }
      - { type: regexp, operand: dest.host, data: '^(|.*\.)crates\.io$' }
  - name: 300-allow-uv-pypi
    description: PyPI index and downloads
    type: list
    list:
      - { type: simple, operand: process.path, data: /usr/bin/uv }
      - { type: regexp, operand: dest.host, data: '^(pypi\.org|files\.pythonhosted\.org)$' }

# Binaries under $HOME, which the user can overwrite: the rule also checks
# the MD5 taken when the playbook runs, so a replaced binary prompts again.
# A missing path is skipped; update the path after a version change.
light_workstation_opensnitch_checksum_rules:
  - name: 400-allow-discord
    description: Discord (updates itself)
    path: .config/discord/app-1.0.166/Discord
  - name: 400-allow-spotify
    description: Spotify (installed by spotify-launcher)
    path: .local/share/spotify-launcher/install/usr/share/spotify/spotify
  - name: 400-allow-herdr-jira
    description: herdr Jira plugin
    path: .config/herdr/plugins/github/herdr-jira-32053ccf3d18/target/release/herdr-jira
  - name: 400-allow-dwm-systemd-networkd-c
    description: dwmblocks network block
    path: .config/dwmblocks/laptop-dwmblocks/bar-functions/dwm_systemd_networkd_c
  - name: 400-allow-terraform-provider-tailscale
    description: Terraform Tailscale provider (servarr-failover)
    path: .local/state/servarr-failover/infra.tfdata/providers/registry.terraform.io/tailscale/tailscale/0.29.2/linux_amd64/terraform-provider-tailscale_v0.29.2

# Rules opensnitch-ui made during the learning period. They are above now, or
