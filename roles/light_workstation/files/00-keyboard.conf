# Managed by Ansible. Written by systemd-localed(8), read by systemd-localed
# and Xorg.
Section "InputClass"
        Identifier "system-keyboard"
        MatchIsKeyboard "on"
        Option "XkbLayout" "us"
        Option "XkbModel" "pc105"
        Option "XkbVariant" "dvorak-intl"
        Option "XkbOptions" "caps:swapescape,terminate:ctrl_alt_bksp"
EndSection
