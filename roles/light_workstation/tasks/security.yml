---
- name: Security | Install net-tools dependency to chkrootkit
  tags:
    - security
    - chkrootkit
  ansible.builtin.package:
    name: net-tools
    state: present
    update_cache: true
  become: true

- name: Security | Install chkrootkit as malware scanning tool in Arch
  tags:
    - security
    - chkrootkit
  kewlfft.aur.aur:
    name: chkrootkit
    use: yay
    state: present
    update_cache: true
  when: ansible_facts["distribution"] == "Archlinux"
  ignore_errors: true

- name: Security | Install ClamAV as malware scanning tool
  tags:
    - security
    - clamav
  ansible.builtin.package:
    name: clamav
    state: present
    update_cache: true
  become: true
  notify: start clamav

- name: Security | Install arch-audit to find vulnerable packages
  tags:
    - security
    - arch-audit
  community.general.pacman:
    name: arch-audit
    state: present
  become: true
  when: ansible_facts["distribution"] == "Archlinux"

- name: Security | Create the pacman hooks directory
  tags:
    - security
    - arch-audit
  ansible.builtin.file:
    path: /etc/pacman.d/hooks
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: ansible_facts["distribution"] == "Archlinux"

# After each install or upgrade, list the packages that the Arch security
# tracker has a fix for (something to act on: a held, ignored or AUR package),
# then only count the open issues that have no fix yet.
- name: Security | Run arch-audit after each pacman transaction
  tags:
    - security
    - arch-audit
  ansible.builtin.copy:
    dest: /etc/pacman.d/hooks/zz-arch-audit.hook
    owner: root
    group: root
    mode: "0644"
    content: |
      [Trigger]
      Operation = Install
      Operation = Upgrade
      Type = Package
      Target = *

      [Action]
      Description = Checking for vulnerable packages (arch-audit)...
      When = PostTransaction
      Exec = /bin/sh -c 'arch-audit -u -C never; echo "arch-audit: $(arch-audit -qq | wc -l) packages with unfixed issues"'
  become: true
  when: ansible_facts["distribution"] == "Archlinux"

# Lynis FILE-7524: root-only modes for files that tell a local process what
# root runs and when (cron) and how sshd is set up. Ansible restores them if a
# package update resets them. Not /boot/grub/grub.cfg: /boot is the vfat ESP,
# which has no per-file modes; only its fmask/dmask mount options set them.
- name: Security | Find the files that only root should read
  tags:
    - security
    - permissions
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop:
    - { path: /etc/crontab, mode: "0600" }
    - { path: /etc/cron.deny, mode: "0600" }
    - { path: /etc/ssh/sshd_config, mode: "0600" }
    - { path: /etc/cron.d, mode: "0700" }
    - { path: /etc/cron.hourly, mode: "0700" }
    - { path: /etc/cron.daily, mode: "0700" }
    - { path: /etc/cron.weekly, mode: "0700" }
    - { path: /etc/cron.monthly, mode: "0700" }
  loop_control:
    label: "{{ item.path }}"
  become: true
  register: light_workstation_root_only_files

- name: Security | Restrict the files that only root should read
  tags:
    - security
    - permissions
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    mode: "{{ item.item.mode }}"
    owner: root
    group: root
  loop: "{{ light_workstation_root_only_files.results | selectattr('stat.exists') }}"
  loop_control:
    label: "{{ item.item.path }}"
  become: true
