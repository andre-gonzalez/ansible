---
- name: Kernel-hardening | Deploy sysctl hardening configuration
  tags:
    - security
    - kernel-hardening
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kernel-hardening.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Ignore broadcast ICMP (prevents smurf attacks)
      net.ipv4.icmp_echo_ignore_broadcasts = 1

      # Do not send ICMP redirects (not acting as a router)
      net.ipv4.conf.all.send_redirects = 0

      # Enable full ASLR (memory protection)
      kernel.randomize_va_space = 2

      # Hide kernel addresses from every user, root included (KASLR bypass)
      kernel.kptr_restrict = 2

      # Only privileged users load eBPF, and the value stays locked until reboot
      kernel.unprivileged_bpf_disabled = 1

      # Constant blinding for every eBPF JIT program (JIT spray)
      net.core.bpf_jit_harden = 2

      # Only CAP_SYS_MODULE may autoload TTY line disciplines (CVE-2017-2636)
      dev.tty.ldisc_autoload = 0

      # No O_CREAT on another user's FIFO or file in sticky directories,
      # group-writable ones included (/tmp spoofing)
      fs.protected_fifos = 2
      fs.protected_regular = 2

      # Kept on purpose, see /etc/lynis/custom.prf:
      #   fs.suid_dumpable = 2              systemd-coredump stores the dumps as root
      #   net.ipv4.conf.all.forwarding = 1  docker, tailscale and libvirt route
      #   kernel.sysrq = 16                 sync only, needs the local keyboard
  become: true
  notify: Apply sysctl settings

# A user process loads a protocol module just by opening a socket of that
# family; these modules have a long CVE history and no use on a laptop.
# "install ... /bin/false" also stops a manual modprobe, and it is the form
# Lynis NETW-3200 looks for. dccp is gone since Linux 6.16 and stays listed
# for older kernels. Not llc: bridge, and so docker, needs it.
- name: Kernel-hardening | Block rare network protocol and line discipline modules
  tags:
    - security
    - kernel-hardening
  ansible.builtin.copy:
    dest: /etc/modprobe.d/rare-protocols.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      install dccp /bin/false
      install sctp /bin/false
      install rds /bin/false
      install tipc /bin/false
      install n_hdlc /bin/false
      install atm /bin/false
      install can /bin/false
  become: true
