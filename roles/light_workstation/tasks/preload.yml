---
# preload no longer runs on the laptops: it is a root daemon that reads the
# memory maps of every process, with no sandbox (systemd-analyze security 9.6),
# for a gain an NVMe disk does not need. The NixOS hosts dropped it too
# (T14_PLAN.md decision 12). Stop it, then remove the package and its config.
- name: Preload | Stop and disable preload
  tags:
    - preload
  ansible.builtin.service:
    name: preload
    state: stopped
    enabled: false
  become: true
  failed_when: false

- name: Preload | Remove preload package when distribution is Archlinux
  tags:
    - preload
  community.general.pacman:
    name: preload
    state: absent
  become: true
  when: ansible_facts["distribution"] == "Archlinux"

- name: Preload | Remove preload package when distribution is Ubuntu
  tags:
    - preload
  ansible.builtin.package:
    name: preload
    state: absent
  become: true
  when: ansible_facts["distribution"] == "Ubuntu"

- name: Preload | Remove /etc/preload.conf
  tags:
    - preload
  ansible.builtin.file:
    path: /etc/preload.conf
    state: absent
  become: true
