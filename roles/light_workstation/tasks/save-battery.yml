---
- name: Save Battery | Install tlp package
  tags:
    - save-battery
    - tlp
  ansible.builtin.package:
    name:
      - tlp # Power managment for laptop battery
      - tlp-rdw
      - smartmontools # Contorl and monitor hard drives
      - ethtool
    state: present
    update_cache: false
  become: true
  when: '"Notebook" in ansible_facts["form_factor"]'

- name: Save Battery | Mask systemd-rfkill.service to avoid conflicts with TLP
  tags:
    - save-battery
    - tlp
  ansible.builtin.service:
    name: systemd-rfkill.service
    masked: true
  become: true
  when: '"Notebook" in ansible_facts["form_factor"]'

- name: Save Battery | Mask systemd-rfkill.socket to avoid conflicts with TLP
  tags:
    - save-battery
    - tlp
  ansible.builtin.service:
    name: systemd-rfkill.socket
    masked: true
  become: true
  when: '"Notebook" in ansible_facts["form_factor"]'

# tlp.service declares Conflicts=power-profiles-daemon.service, so whenever PPD
# is running TLP is never started and none of the settings below are applied.
# Masking is required rather than disabling: the desktop D-Bus activates PPD on
# demand, which brings it straight back.
- name: Save Battery | Mask power-profiles-daemon to avoid conflicts with TLP
  tags:
    - save-battery
    - tlp
  ansible.builtin.systemd:
    name: power-profiles-daemon.service
    state: stopped
    enabled: false
    masked: true
  become: true
  failed_when: false
  when: '"Notebook" in ansible_facts["form_factor"]'

# All tunables live in a drop-in. TLP reads /etc/tlp.conf first and then
# /etc/tlp.d/*.conf, later definitions winning, so this replaces the previous
# per-setting `lineinfile` tasks without fighting the packaged config file.
- name: Save Battery | Deploy TLP drop-in configuration
  tags:
    - save-battery
    - tlp
  ansible.builtin.template:
    src: tlp-local.conf.j2
    dest: /etc/tlp.d/01-local.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: restart_tlp
  when: '"Notebook" in ansible_facts["form_factor"]'

- name: Save Battery | Enable tlp service
  tags:
    - save-battery
    - tlp
  ansible.builtin.service:
    name: tlp
    enabled: true
    state: started
  become: true
  when: '"Notebook" in ansible_facts["form_factor"]'

- name: Save Battery | Install powertop package
  tags:
    - save-battery
    - powertop
  ansible.builtin.package:
    name:
      - powertop # Show informations about what is consuming your battery
    state: present
    update_cache: false
  become: true
  notify: calibrate_powertop
  when: '"Notebook" in ansible_facts["form_factor"]'

# - name: Calibrate powertop
#   tags:
#     - save-battery
#     - powertop
#   ansible.builtin.command: powertop --calibrate
#   become: true
  #   when: calibrate_powertop is changed
#   changed_when: calibrate_result.rc != 2
