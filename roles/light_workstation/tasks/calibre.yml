---
# Calibre no longer runs on the laptop. Remove the package and its ufw rules
# where they still exist: ufw keeps rules that are no longer declared.
- name: Calibre | Remove calibre
  tags:
    - calibre
  ansible.builtin.package:
    name: calibre
    state: absent
  become: true

- name: Calibre | Remove calibre wireless and discovery ports from ufw
  tags:
    - calibre
    - ufw
  community.general.ufw:
    rule: limit
    from_ip: 192.168.0.0/24
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    delete: true
  loop:
    - { port: "9090", proto: tcp }
    - { port: "54982", proto: udp }
  become: true
