---
- name: Snapper | Install snapper and related packages
  tags:
    - snapper
  ansible.builtin.package:
    name:
      - snapper
      - snap-pac
      - grub-btrfs
    state: present
    update_cache: true
  become: true

- name: Snapper | Initialize snapper config for /
  tags:
    - snapper
  ansible.builtin.command: snapper -c root create-config /
  args:
    creates: /etc/snapper/configs/root
  become: true

- name: Snapper | Initialize snapper config for /home
  tags:
    - snapper
  ansible.builtin.command: snapper -c home create-config /home
  args:
    creates: /etc/snapper/configs/home
  become: true

# create-config seeds /etc/snapper/configs/<name> with limits that allow a
# config to grow to roughly 90 snapshots (40 timeline + 50 number), which is
# what lets snapshots quietly consume a workstation disk. Rewriting the keys in
# place leaves the rest of the packaged file alone while making the limits
# declarative here; snapper re-reads the file on every invocation, so no
# reload is needed.
#
# Each config gets the shared retention with its own overrides merged on top,
# flattened into one (config, key, value) item per line to rewrite.
- name: Snapper | Apply snapshot retention limits
  tags:
    - snapper
  ansible.builtin.lineinfile:
    path: /etc/snapper/configs/{{ item.config }}
    regexp: ^{{ item.key }}=
    line: '{{ item.key }}="{{ item.value }}"'
  loop: "{{ light_workstation_snapper_retention_items }}"
  loop_control:
    label: "{{ item.config }} {{ item.key }}={{ item.value }}"
  vars:
    light_workstation_snapper_retention_items: >-
      {%- set items = [] -%}
      {%- for config in light_workstation_snapper_configs -%}
      {%-   set merged = light_workstation_snapper_retention
                         | combine(light_workstation_snapper_retention_overrides[config] | default({})) -%}
      {%-   for entry in merged | dict2items -%}
      {%-     set _ = items.append({'config': config, 'key': entry.key, 'value': entry.value}) -%}
      {%-   endfor -%}
      {%- endfor -%}
      {{ items }}
  become: true
  notify: run_snapper_cleanup

# SPACE_LIMIT and FREE_LIMIT are only consulted when the config owns a btrfs
# qgroup. create-config leaves QGROUP empty, so out of the box both are dead
# settings and nothing bounds snapshots by actual disk usage. setup-quota is
# not idempotent — it fails when a qgroup is already assigned — so probe the
# config file rather than relying on the command to no-op.
- name: Snapper | Check whether a btrfs qgroup is assigned
  tags:
    - snapper
  ansible.builtin.command: grep -q '^QGROUP=".\+"' /etc/snapper/configs/{{ item }}
  loop: "{{ light_workstation_snapper_configs }}"
  register: light_workstation_snapper_qgroup
  changed_when: false
  failed_when: false
  become: true

- name: Snapper | Set up btrfs quota so the space limits are enforced
  tags:
    - snapper
  ansible.builtin.command: snapper -c {{ item.item }} setup-quota
  loop: "{{ light_workstation_snapper_qgroup.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  become: true
  notify: run_snapper_cleanup

# Snapper never descends into nested subvolumes, so a directory that is its
# own subvolume stays out of the home snapshots and its space is freed as soon
# as files in it are deleted. tmpfiles type v creates the subvolume only when
# the path does not exist, which makes this safe on a machine whose home is
# already populated: there it does nothing, and the directory has to be
# converted once by hand. On a fresh install it runs before the user logs in
# for the first time, while the paths are still free.
- name: Snapper | Keep cache and game directories out of home snapshots
  tags:
    - snapper
  ansible.builtin.template:
    src: home-nosnapshot.conf.j2
    dest: /etc/tmpfiles.d/home-nosnapshot.conf
    owner: root
    group: root
    mode: "0644"
  vars:
    light_workstation_nosnapshot_user: "{{ lookup('env', 'USER') }}"
    light_workstation_nosnapshot_home: "{{ lookup('env', 'HOME') }}"
  become: true
  register: light_workstation_nosnapshot_tmpfiles

- name: Snapper | Create the nested subvolumes that do not exist yet
  tags:
    - snapper
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/home-nosnapshot.conf
  when: light_workstation_nosnapshot_tmpfiles is changed
  changed_when: true
  become: true

- name: Snapper | Ensure snapper group exists
  tags:
    - snapper
  ansible.builtin.group:
    name: snapper
    state: present
  become: true

- name: Snapper | Add user to snapper group
  tags:
    - snapper
  ansible.builtin.user:
    name: "{{ lookup('env', 'USER') }}"
    groups: snapper
    append: true
  become: true

- name: Snapper | Fix permissions on /.snapshots
  tags:
    - snapper
  ansible.builtin.file:
    path: /.snapshots
    owner: root
    group: snapper
    mode: '0750'
    state: directory
  become: true

- name: Snapper | Enable snapper timeline timer
  tags:
    - snapper
  ansible.builtin.systemd:
    name: snapper-timeline.timer
    enabled: true
    state: started
  become: true

- name: Snapper | Enable snapper cleanup timer
  tags:
    - snapper
  ansible.builtin.systemd:
    name: snapper-cleanup.timer
    enabled: true
    state: started
  become: true

- name: Snapper | Enable grub-btrfs.path for GRUB integration
  tags:
    - snapper
  ansible.builtin.systemd:
    name: grub-btrfsd.service
    enabled: true
    state: started
  become: true
  register: light_workstation_regenerate_grub

- name: Snapper | Regenerate Grub
  tags:
    - snapper
  ansible.builtin.command: grub-mkconfig -o /boot/grub/grub.cfg
  become: true
  when: light_workstation_regenerate_grub is changed
