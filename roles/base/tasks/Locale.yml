---
- name: Locale | Install locale package when distribution is Ubuntu
  tags:
    - locale
  ansible.builtin.package:
    name:
      - locales
    state: present
  become: true
  when: ansible_facts["distribution"] in ["Ubuntu", "Debian"]

- name: Locale | Set timezone to "{{ base_timezone }}"
  tags:
    - timezone
  community.general.timezone:
    name: "{{ base_timezone }}"
  become: true

- name: Locale | Ensure the locale exists
  tags:
    - locale
  community.general.locale_gen:
    name: "{{ base_locale }}"
    state: present
  become: true
